<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>【測試版】榴槤村快閃 POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE everyday work tool for counter staff: calm, big, impossible to mis-tap
   IDEA the paper 日銷表 and the mall receipt: every number lands where the paper had it, filled by the machine
   PICTURE the product grid itself, with the live total in the green cart bar
   COLOUR durian-leaf deep green bars (logo ground), white cards, gold for prices and gifts, flesh yellow bars, red for problems
   TYPE Noto Sans TC 900 for figures and titles + Noto Sans TC text
   LAYOUT phone: logo bar, chips, grid, sticky cart bar, tab bar; wide: more columns, sheets centred */
:root{color-scheme:light dark;--bg:light-dark(#eef1ec,#0c1411);--card:light-dark(#ffffff,#141f1a);--ink:light-dark(#13201a,#e7eee9);--mute:light-dark(#56655d,#9fb2a7);--line:light-dark(#dbe2da,#26352e);--green:light-dark(#0f4a35,#46b484);--deep:light-dark(#0f3a2a,#0a271c);--gold:light-dark(#9a6b12,#e2b85c);--gold-soft:light-dark(#fbf3df,#29220f);--flesh:light-dark(#f2d36a,#b89a35);--ok:light-dark(#127a46,#5bd394);--ok-soft:light-dark(#e3f5ea,#11301f);--bad:light-dark(#b42318,#ff8f80);--bad-soft:light-dark(#fdecea,#3a1612);--warn:light-dark(#8f5206,#f3b454);--warn-soft:light-dark(#fff4e0,#33260f)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
.num,td,.kpi b{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff;padding:8px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px}
.top .logo{height:38px;width:auto;flex:none}
.top .who{flex:1;line-height:1.3}
.top .who b{font-size:16px;display:block}
.top .who span{font-size:13px;opacity:.82}
.top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px;min-height:44px;font-size:14px}
.mode{font-size:11px;border-radius:999px;padding:1px 7px;background:rgba(255,255,255,.14);margin-left:6px;font-weight:400;white-space:nowrap}
.main{padding:14px 16px 180px;max-width:1240px;margin:0 auto}
.main.nobar{padding-bottom:110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{border:0;background:none;padding:8px 2px 10px;font-size:13px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--green);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;min-height:44px;font-size:15px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.chip.sm{min-height:40px;padding:6px 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px}
.pc{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;min-height:122px;display:flex;flex-direction:column;gap:3px}
.pc:active{transform:scale(.98)}
.pc .n{font-weight:700;font-size:17px;line-height:1.25}
.pc .s{font-size:13px;color:var(--mute);line-height:1.35}
.pc .g{font-size:13px;color:var(--gold);font-weight:500;line-height:1.35}
.pc .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:4px 8px;flex-wrap:wrap;padding-top:4px}
.pc .p{font-size:21px;font-weight:900;color:var(--green);white-space:nowrap}
.pc .o{font-size:13px;color:var(--mute);text-decoration:line-through;margin-left:6px;font-weight:400}
.pc .st{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--mute);white-space:nowrap}
.pc .st.low{background:var(--bad-soft);color:var(--bad)}
.pc .q{position:absolute;top:-7px;left:-7px;min-width:28px;height:28px;border-radius:14px;background:var(--gold);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;padding:0 7px}
.pc.combo{border-color:color-mix(in srgb,var(--gold) 50%,var(--line));background:var(--gold-soft)}
.pc[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.pc .lock{font-size:12px;color:var(--warn);font-weight:500}
.cartbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:25;padding:8px 16px}
.cartbar button{width:100%;max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;border:0;border-radius:14px;background:var(--green);color:#fff;padding:10px 16px;min-height:58px;font-size:17px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.cartbar .cnt{background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px;font-size:14px}
.cartbar .tot{margin-left:auto;font-size:22px;font-weight:900}
.cartbar.empty button{background:var(--card);color:var(--mute);border:1px dashed var(--line);box-shadow:none;font-weight:500;justify-content:center}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-14px;background:var(--card);padding:6px 0 8px;z-index:2}
.sh-h h2{margin:0;font-size:21px}
.x{border:0;background:var(--bg);border-radius:12px;min-width:44px;min-height:44px;font-size:22px;line-height:1}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .nm{font-weight:700}
.line .sub{font-size:13px;color:var(--mute)}
.line .amt{font-weight:700;white-space:nowrap;min-width:4.5em;text-align:right}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.step button{border:0;background:var(--bg);width:44px;height:44px;font-size:22px;line-height:1}
.step input,.step span{width:46px;text-align:center;font-weight:700;border:0;background:none;font-size:17px;height:44px;line-height:44px;padding:0}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;background:var(--gold-soft);color:var(--gold);margin-left:6px;font-weight:500;white-space:nowrap}
.tag.red{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.gray{background:var(--bg);color:var(--mute)}
.sec{margin:18px 0 6px;font-size:14px;color:var(--mute);font-weight:700}
.field{display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;gap:8px;align-items:center;margin:8px 0}
.field label{font-weight:500}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;min-height:46px;font-size:17px}
.in.r{text-align:right;font-weight:700}
.in.sm{min-height:42px;padding:6px 8px;font-size:16px}
.in:focus{outline:2px solid var(--gold);outline-offset:1px}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mini{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;min-height:44px;font-size:14px;white-space:nowrap}
.mini.on{border-color:var(--green);color:var(--green);font-weight:700}
.mini.gold{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700;font-size:16px;padding:6px 16px}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
.sum.big b{font-size:34px;font-weight:900;color:var(--green)}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:700;font-size:18px;min-height:58px;margin-top:14px}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.bad{background:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.msg{border-radius:10px;padding:8px 12px;font-size:14px;margin:6px 0}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.gold{background:var(--gold-soft);color:var(--gold)}
.deal{border:1px dashed color-mix(in srgb,var(--gold) 60%,var(--line));border-radius:14px;padding:10px 12px;background:var(--gold-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:17px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mute);font-weight:500;vertical-align:bottom}
td.l,th.l{text-align:left}
td.wrap{white-space:normal;min-width:10em}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.frz td:first-child,.frz th:first-child{position:sticky;left:0;background:var(--card);z-index:1;box-shadow:1px 0 0 var(--line)}
td.hl{font-weight:900;color:var(--green)}
td.neg,.neg{color:var(--bad);font-weight:700}
tr.void td{color:var(--mute);text-decoration:line-through}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi span{font-size:13px;color:var(--mute)}
.kpi b{display:block;font-size:clamp(22px,4vw,28px);font-weight:900;line-height:1.2;white-space:nowrap}
.kpi i{font-style:normal;font-size:13px;color:var(--mute)}
h1{font-size:clamp(24px,4.6vw,34px);line-height:1.15;margin:4px 0 14px;letter-spacing:-.01em;text-wrap:balance}
.hbar{display:grid;grid-template-columns:minmax(6em,9em) minmax(0,1fr) 3em;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.hbar .b{height:14px;border-radius:7px;background:var(--flesh)}
.hbar .v{text-align:right;font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:9px;min-height:42px;font-size:15px;padding:0 4px}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.14);color:var(--green)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;align-items:start}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pr .now{font-size:13px;color:var(--mute)}
.pr .aft{min-width:3.4em;text-align:right;font-weight:700;color:var(--green)}
.dbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.dbar button{border:0;background:var(--bg);border-radius:10px;min-height:44px;padding:0 12px;font-size:14px;color:var(--green);font-weight:700}
.dbar button:disabled{opacity:.35}
.dbar .dl{text-align:center;line-height:1.2}.dbar .dl b{display:block;font-size:17px}.dbar .dl span{font-size:12px;color:var(--mute)}
.dbar.past{border-color:var(--gold);background:var(--gold-soft)}
.back2{display:block;margin:-6px 0 12px auto}
table.hours td,table.hours th{padding:6px}table.hours tr.z td{color:var(--mute);opacity:.6}table.hours tr.pk td{font-weight:800;color:var(--green)}
.hb{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;min-width:60px}.hb i{display:block;height:100%;background:var(--green);border-radius:5px}
.cs-h,.cs-r{display:grid;grid-template-columns:minmax(0,1fr) 3.3em 3.3em 3.3em 2.2em;gap:6px;align-items:center}
.cs-h{font-size:12px;font-weight:700;color:var(--mute);padding:4px 0;border-bottom:1px solid var(--line)}.cs-h div:not(:first-child){text-align:center}
.cs-g{font-size:12px;font-weight:700;padding:6px 8px;margin:8px 0 0;border-radius:6px}.cs-g.d{background:var(--ok-soft);color:var(--ok)}.cs-g.s{background:var(--gold-soft);color:var(--gold)}
.cs-r{padding:8px 0;border-bottom:1px solid var(--line)}.cs-r .nm{line-height:1.2}.cs-r .nm b{display:block}.cs-r .in.sm{padding-left:4px;padding-right:6px}
.cs-r .t{text-align:right;font-weight:900;color:var(--green)}
.cs-x{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--mute)}
.cs-x label{display:flex;align-items:center;gap:4px}.cs-x input[type=date]{width:9.6em}.cs-x input:not([type=date]){width:3.3em}
.lhead,.lrow{display:grid;grid-template-columns:3.9em 2em repeat(3,minmax(0,1fr)) 2em 2em repeat(2,minmax(0,.8fr));gap:4px;align-items:center}
.lhead{position:sticky;top:60px;line-height:1.15;z-index:2;background:var(--card);font-size:11px;font-weight:700;color:var(--mute);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.lgrp{padding:8px 0 4px;border-bottom:1px solid var(--line)}.lg-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-bottom:4px}.lg-h b{font-size:16px}.lg-h .sold{margin-left:auto;font-weight:700;color:var(--green);font-size:13px}.lg-h .sold.neg{color:var(--bad)}
.lrow{margin-top:4px}.lrow .numf{min-height:44px;font-size:18px;padding:0}.lrow .numf.sm2{width:auto;min-height:44px;font-size:16px;background:var(--bg);border-style:dashed}.lrow .numf.sm2.set{border-style:solid}
.lrow .numf.chk{border-color:var(--gold);background:var(--gold-soft)}.lrow .numf.chk.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}.lrow .numf.chk.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.mism-t{font-size:12px;color:var(--bad);font-weight:700;margin:2px 0 0 4em}
.lrow .ro{text-align:center;font-weight:800;font-size:15px;color:var(--mute)}.lrow .ro.sub{color:var(--green)}.lrow .ro.sold.on{color:var(--ink)}.lrow .ro.sold.neg{color:var(--bad)}
.lhead span{font-size:10.5px}.lrow .numf{font-size:17px}.expb{font-size:11.5px!important}
.expb{min-height:44px;border:1px solid var(--green);border-radius:10px;background:var(--card);font-size:13px;font-weight:700;color:var(--green);padding:0 2px}.expb.empty{border-style:dashed;color:var(--bad);border-color:var(--bad)}
.addl{display:block;margin:6px 0 2px;font-size:13px}
.csi{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;background:var(--card)}
.csi-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}.csi-h b{font-size:17px}.csi-h .sold{margin-left:auto;font-weight:700;color:var(--green)}.csi-h .sold.neg{color:var(--bad)}
.lotc{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}.lot-h{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.lot-h .lnk{margin-left:auto;font-size:13px}
.lot-q{margin-top:8px}.lq-h,.lq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 2.6em;gap:6px;align-items:center}.lq-h{font-size:12px;color:var(--mute);text-align:center}.lq .t{text-align:right;font-weight:900;color:var(--green)}
.lotc .io{display:flex;gap:16px;margin-top:8px;font-size:13px;color:var(--mute)}.lotc .io label{display:flex;align-items:center;gap:6px}
.addlot{margin-top:10px;width:100%}
.lot{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 3.3em 3.3em 3.3em 2.2em;gap:6px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}.lot .nm{display:flex;gap:8px;align-items:center}
.cs-e{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mute)}.cs-e .chip.sm{min-height:34px;padding:4px 10px;font-size:13px}.cs-e input[type=date]{width:9.6em}
.cs-x .io{flex-basis:100%;display:flex;gap:14px;padding-left:2.4em}
.cs-x .sold{margin-left:auto;font-weight:700;color:var(--green);font-size:13px}.cs-x .sold.neg{color:var(--bad)}
.cpg{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr));gap:6px 10px}.cpg label{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px}.cpg input{width:5em}
.lnk{border:0;background:none;color:var(--green);font-weight:700;text-decoration:underline;padding:0;font:inherit}
.need{outline:3px solid var(--bad)!important;outline-offset:2px;border-radius:10px;animation:pulse 1s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,35,24,.5)}100%{box-shadow:0 0 0 12px rgba(180,35,24,0)}}
.guard.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.guard{background:var(--bad-soft);border:2px solid var(--bad);color:var(--bad);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:16px;line-height:1.5}.guard b{display:block;font-size:18px;margin-bottom:4px}
.acc{border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--card);overflow:hidden}
.acc-h{width:100%;border:0;background:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 14px;font-size:17px;text-align:left;color:var(--ink)}
.acc-h b{flex:none}.acc-s{flex:1;text-align:right;font-size:14px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acc-s.on{color:var(--gold);font-weight:700}.chev{color:var(--mute);font-size:14px}
.acc.open{border-color:var(--gold)}.acc-b{padding:4px 14px 14px}
.big-step{min-width:72px;min-height:56px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:20px;font-weight:800;color:var(--ink)}.big-step.gold{background:var(--gold);color:#fff;border-color:var(--gold)}.big-step:disabled{opacity:.35}
.c{text-align:center}.dv{font-size:24px;color:var(--gold)}
.reason{border:2px solid var(--gold);border-radius:14px;padding:10px 12px;margin:4px 0 8px;background:var(--gold-soft)}
.ck{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}.ck.ok{border-color:var(--ok);background:var(--ok-soft)}.ck.bad{border-color:var(--bad);background:var(--bad-soft)}
.ck-n{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:16px}.ck-n span{color:var(--mute);font-size:14px}.ck-n .sys{font-size:22px;color:var(--ink)}
.ck-b{display:flex;gap:8px;margin-top:8px;align-items:center}.ck-b .yes,.ck-b .no{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:17px;font-weight:700;color:var(--ink)}
.ck-b .yes.on{background:var(--ok);color:#fff;border-color:var(--ok)}.ck-b .no{flex:.6;color:var(--bad)}.ck-v{flex:1;text-align:center;font-size:26px;font-weight:900}
.ck-d{margin-top:6px;font-size:14px;color:var(--bad);font-weight:700}
.nag{display:block;width:100%;text-align:left;border:2px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:700;margin-bottom:10px}
.numf{min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:20px;font-weight:800;color:var(--mute);padding:0}.numf.set{background:var(--card);color:var(--ink);border-color:var(--green)}
.numf.sm2{min-height:40px;width:3.4em;font-size:17px}.numf.ck-v{flex:1;min-height:56px;font-size:26px}
.pk-now{display:flex;align-items:baseline;gap:12px;margin:-4px 0 10px}.pk-now b{font-size:34px;color:var(--green)}.pk-now span:first-child{font-size:18px;color:var(--mute)}
.pkg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.pk{min-height:58px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:22px;font-weight:800;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.pk small{font-size:11px;font-weight:700;margin-top:3px}.pk.hint{border:2px solid var(--gold);background:var(--gold-soft);color:var(--gold)}.pk.on{background:var(--green);color:#fff;border-color:var(--green)}
.cnt-row{display:grid;grid-template-columns:minmax(0,1fr) 4.2em 4.2em 2.6em;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cnt-row .t{text-align:right;font-weight:900;color:var(--green)}
.cnt-row .exp{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.cnt-row .exp input{max-width:11em}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;border-radius:10px;overflow:hidden;background:var(--bg);aspect-ratio:1;border:1px solid var(--line);padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upl{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:14px;min-height:64px;padding:10px;font-weight:700;color:var(--green);cursor:pointer;background:var(--card)}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.login{min-height:100vh;min-height:100dvh;box-sizing:border-box;background:var(--deep);color:#fff;padding:24px max(18px,5vw) 40px}
.login .wrap{max-width:560px;width:100%;margin:0 auto}
.login .logo{width:150px;height:auto;display:block;margin:4px auto 6px}
html:has(.login),body:has(.login){background:var(--deep)}
.login h1{color:#fff;font-size:clamp(26px,7vw,36px);font-weight:900;margin:10px 0 4px;text-align:center}
.login p{opacity:.82;margin:0 0 16px;text-align:center}
.role{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:rgba(255,255,255,.07);color:#fff;padding:14px 16px;margin:10px 0;min-height:74px}
.role b{display:block;font-size:19px}
.role span{font-size:14px;opacity:.8}
.role .ic{width:44px;height:44px;border-radius:12px;background:var(--flesh);color:#2a2205;display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
.login .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff;min-height:52px;font-size:17px;padding:10px 18px}
.login .in{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff;font-size:22px;letter-spacing:.3em;text-align:center}
.login .btn{background:var(--flesh);color:#2a2205}
.back{background:none;border:0;color:#fff;opacity:.85;min-height:44px;padding:0;font-size:15px}
.small{font-size:13px;color:var(--mute)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:90;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:90vw}
.ok-big{text-align:center;padding:10px 0 4px}
.ok-big .ck{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 8px;font-size:34px;font-weight:900}
.ok-big b{display:block;font-size:34px;font-weight:900;color:var(--green)}
pre.rep{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font:15px/1.6 'Noto Sans TC',sans-serif;margin:8px 0}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.stepno{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-size:14px;font-weight:700;margin-right:8px}
.big-img{width:100%;border-radius:12px;display:block}
@media(prefers-reduced-motion:no-preference){.pc{transition:transform .08s}.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}}}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px;max-height:90%}.grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr))}}
@media(max-width:600px){table{font-size:13px}th,td{padding:7px 5px}.tabs button{font-size:12px}}
</style>
</head>

<div id="app"><div class="login"><div class="wrap">榴槤村 POS 載入中…</div></div></div>
<div id="sheet"></div>
<div id="toast"></div>

const Store={db:null,assets:undefined,
  async boot(){
    if(typeof google!=='undefined'&&google.script&&google.script.run){S.mode='gas';await this.gasPull();setInterval(()=>this.gasPull().then(schedule),20000);return}
    if(window.claude&&typeof window.claude.use==='function'){
      try{const db=await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),6000))]);
        if(db){this.db=db;S.mode='db';this.sub();return}}catch(e){}}
    S.mode='local';this.localLoad();
  },
  sub(){const db=this.db;const t=setTimeout(()=>{S.ui.slow=true;schedule()},10000);
    COLLS.forEach(k=>db.collection(k).onSnapshot(s=>{S[k]=s.docs.map(d=>d.data());if(!s.metadata.fromCache){clearTimeout(t);S.ui.slow=false}schedule()},e=>{S.ui.dberr=e.code;schedule()}));
    db.doc('config/main').onSnapshot(s=>{S.config=Object.assign(clone(DEFAULT_CONFIG),s.exists?s.data():{});schedule()},()=>{});
  },
  gasCall(fn,...a){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a))},
  async gasPull(){try{const d=await this.gasCall('getAll');COLLS.forEach(k=>S[k]=d[k]||[]);if(d.config)S.config=Object.assign(clone(DEFAULT_CONFIG),d.config)}catch(e){toast('雲端讀取失敗：'+(e.message||e))}},
  localLoad(){try{const d=JSON.parse(localStorage.getItem('dpos-data2')||'null');if(d&&d.txns){COLLS.forEach(k=>S[k]=d[k]||[]);if(d.config)S.config=Object.assign(clone(DEFAULT_CONFIG),d.config);return}}catch(e){}
    const d=demoData();COLLS.forEach(k=>S[k]=d[k]);this.localSave()},
  localSave(){try{const o={config:S.config};COLLS.forEach(k=>o[k]=S[k]);localStorage.setItem('dpos-data2',JSON.stringify(o))}catch(e){}},
  put(kind,obj){const a=S[kind];const i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.push(obj)},
  async save(kind,obj){if(kind==='moves')obj.linesText=lineTxt(obj.lines);if(obj.store)obj.storeName=sname(obj.store);obj=clone(obj);this.put(kind,obj);
    try{if(S.mode==='db')await this.db.collection(kind).doc(obj.id).set(obj);
      else if(S.mode==='gas')await this.gasCall('saveRecord',kind,obj);
      else this.localSave();return true}
    catch(e){toast('沒有存到雲端，請再按一次（'+(e.code||e.message||e)+'）');return false}},
  async saveConfig(c){S.config=c;try{if(S.mode==='db')await this.db.doc('config/main').set(clone(c));else if(S.mode==='gas')await this.gasCall('saveConfig',c);else this.localSave();toast('設定已儲存')}catch(e){toast('設定沒有存到：'+(e.code||e.message))}},
  async getAssets(){if(this.assets!==undefined)return this.assets;this.assets=null;try{if(window.claude&&window.claude.use)this.assets=await Promise.race([window.claude.use('assets'),new Promise(r=>setTimeout(()=>r(null),4000))])}catch(e){}return this.assets},
  async addPhoto(file,meta){
    let src;
    if(S.mode==='db'){const as=await this.getAssets();
      if(as){try{const b=await shrink(file,1600,.8);const r=await as.upload(b,{type:'image/jpeg'});src={asset:r.id}}catch(e){}}
      if(!src){let b=await shrink(file,900,.6);let d=await toData(b);if(d.length>240000){b=await shrink(file,700,.5);d=await toData(b)}src={data:d}}}
    else if(S.mode==='gas'){const d=await toData(await shrink(file,1280,.75));const r=await this.gasCall('savePhoto',d,meta.store+'_'+meta.date+'_'+meta.kind);src={url:r.url}}
    else{src={data:await toData(await shrink(file,800,.6))}}
    const rec={id:uid('p'),ts:Date.now(),time:nowTime(),...meta,src};if(await this.save('photos',rec))return rec;return null},
  async loadDemo(){const d=demoData();for(const k of COLLS)for(const o of d[k])await this.save(k,o);toast('已載入示範資料')},
  async resetLocal(){COLLS.forEach(k=>S[k]=[]);S.config=clone(DEFAULT_CONFIG);this.localSave()}
};

const toData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});

        if(more.length){S.ui.confirm='pt';S.ui.guard={list:[more.map(c=>c.name+' 比應有多 '+(tot(c.id)-e[c.id])).join('、')+'。是不是點錯，或有補貨沒登錄？這次帶來補的請填在「進貨」，不是加在架上。'],confirm:true};S.ui.jump='guard';return render()}}
      S.ui.guard=null;S.ui.confirm=null}
    for(const [k,l] of Object.entries(T.lines)){const ls=lotsOf(l).filter(lotUsed);if(!ls.length)continue;
      const z=x=>({exp:x.exp||'',shelf:num(x.shelf),under:num(x.under),wh:num(x.wh),chk:num(x.chk),in:num(x.in),out:num(x.out)});lines[k]={lots:ls.map(z)};
      const i=ls.reduce((a,x)=>a+num(x.in),0),o=ls.reduce((a,x)=>a+num(x.out),0);if(i)inQ[k]=i;if(o)outQ[k]=o}
    const old=T.editId?S.counts.find(c=>c.id===T.editId):null;const ts=old?old.ts:Date.now();
    const c={id:old?old.id:uid('c'),store:s,date:T.date,time:old?old.time:nowTime(),ts,by:old?old.by:S.session.name,lines,inQ,outQ,before:T.before,after:T.after,issues:T.issues,note:T.note.trim()};
    if(old){c.edited=Date.now();c.editedBy=S.session.name}
    Store.put('counts',c);c.report=countReport(c)+(old?'\n（'+nowTime()+' 修改）':'');
    if(!(await Store.save('counts',c))){render();return}
    const hadIn=old&&S.moves.some(m=>m.id===c.id+'-in'),hadOut=old&&S.moves.some(m=>m.id===c.id+'-out');
    if(Object.keys(inQ).length||hadIn)await Store.save('moves',{id:c.id+'-in',store:s,date:T.date,time:c.time,ts:ts+1,type:'restock',by:c.by,role:'pt',lines:inQ,reason:'盤點時補貨',note:''});
    if(Object.keys(outQ).length||hadOut)await Store.save('moves',{id:c.id+'-out',store:s,date:T.date,time:c.time,ts:ts+2,type:'return',by:c.by,role:'pt',lines:outQ,reason:'盤點時登錄：其他（退回／報廢）',note:''});
    S.ui.lastCountRep=c.report;S.pt=ptInit();toast(old?'修改已儲存':'盤點已送出');window.scrollTo(0,document.body.scrollHeight);render()},
  ptedit(v){const c=S.counts.find(x=>x.id===v);if(!c||c.date!==today())return toast('只能修改今天的盤點');const lines={};const st=x=>x==null||x===''||(!num(x)&&x!==0&&x!=='0')?'':String(num(x));
    for(const [k,l] of Object.entries(c.lines||{})){const ls=lotsOf(l).map(x=>({exp:x.exp||'',shelf:String(num(x.shelf)),under:String(num(x.under)),wh:num(x.wh)?String(num(x.wh)):'',chk:'chk' in x?String(num(x.chk)):'',in:num(x.in)?String(num(x.in)):'',out:num(x.out)?String(num(x.out)):''}));
      if(!ls.some(x=>x.in)&&(c.inQ||{})[k])ls[0].in=String(c.inQ[k]);if(!ls.some(x=>x.out)&&(c.outQ||{})[k])ls[0].out=String(c.outQ[k]);lines[k]={lots:ls}}
    for(const [k,q] of Object.entries(c.inQ||{}))if(!lines[k])lines[k]={lots:[{exp:'',in:String(q)}]};for(const [k,q] of Object.entries(c.outQ||{}))if(!lines[k])lines[k]={lots:[{exp:'',out:String(q)}]};
    S.pt={date:c.date,lines,before:[...(c.before||[])],after:[...(c.after||[])],issues:[...(c.issues||[])],note:c.note||'',all:false,editId:c.id,prefill:'x'};S.ui.lastCountRep=null;window.scrollTo(0,0)},
  ptcancel(){S.pt=ptInit();S.ui.guard=null},
  ptlotadd(v){const L=S.pt.lines[v]=S.pt.lines[v]||{lots:[]};L.lots=L.lots||[];L.lots.push({exp:''});S.ui.ex={id:v,j:L.lots.length-1};S.sheet='exp';S.ui.pkTop=true},
  ptexpopen(v){const [id,j]=v.split('|');S.ui.ex={id,j:+j};S.sheet='exp';S.ui.pkTop=true},
  ptexpset(v){const E=S.ui.ex;S.pt.lines[E.id].lots[E.j].exp=v;S.sheet=null;S.ui.ex=null},
  ptexpdel(){const E=S.ui.ex;const L=S.pt.lines[E.id];if(L.lots.length>1)L.lots.splice(E.j,1);S.sheet=null;S.ui.ex=null},
  ptlotdel(v){const [id,j]=v.split('|');const L=S.pt.lines[id];if(L.lots.length>1)L.lots.splice(+j,1)},
  ptexp(v){const i=v.lastIndexOf('|');setPath(v.slice(0,i)+'.exp',v.slice(i+1))},
  astore(v){S.adm.store=v;S.adm.q={}},atype(v){S.adm.type=v},
  aq(v,el){S.adm.q[v]=String(Math.max(0,num(S.adm.q[v])+ +el.dataset.d))},
  async asave(){const G=S.adm;const lines={};for(const [k,v] of Object.entries(G.q))if(num(v))lines[k]=num(v);
    {const list=[];if(!Object.keys(lines).length)list.push('請輸入至少一項的數量');const isC=STORES.find(x=>x.id===G.store).type==='consign';const sign=MOVE_TYPES[G.type].sign;
      if(sign<0){const ex=isC?consignExpected(G.store,G.date).e:null,st=isC?null:stockTable(G.store,G.date);const neg=Object.entries(lines).filter(([k,q])=>(isC?ex[k]:st[k].avail)-q<0);if(neg.length)list.push(neg.map(([k])=>isC?cname(k):pname(k)).join('、')+' 登錄後會變負數');}
      if(blockIf(list,[]))return render();S.ui.guard=null}
    const m={id:uid('m'),store:G.store,date:G.date,time:nowTime(),ts:Date.now(),type:G.type,by:S.session.name,role:'admin',lines,reason:G.note.trim(),note:'',seq:G.type==='restock'||G.type==='in'?restockSeq(G.store,G.date):null};
    if(await Store.save('moves',m)){toast('已登錄到 '+sname(G.store));G.q={};G.note=''}render()},
  bstore(v){S.boss.store=v},
  bview(v){S.boss.view=v;if(v==='month')S.boss.month=(S.boss.date||latestDate()).slice(0,7);window.scrollTo(0,0)},
  bgoday(v){S.boss.view='day';S.boss.date=v;window.scrollTo(0,0)},
  stopen(v){const [pt,month]=v.split('|');const st=stmtOf(pt,month);S.ui.stEdit={pt,month,paste:'',msg:null,draft:st?clone({days:st.days||{},amount:st.amount,commission:st.commission,deduct:st.deduct,payable:st.payable,rate:st.rate}):{days:{}}};S.sheet='stmt';S.ui.pkTop=true},
  stparse(){const E=S.ui.stEdit;const o=parseStmt(E.paste);const pt=STORES.find(x=>x.id===E.pt);const msg=[];
    if(o.month&&o.month!==E.month)msg.push(['bad','這張是 '+o.month.replace('-',' 年 ')+' 月的對帳單，你現在在填 '+E.month.replace('-',' 年 ')+' 月。已改成存到 '+o.month.replace('-',' 年 ')+' 月。']);
    if(o.branch&&pt.branch&&o.branch!==pt.branch)msg.push(['bad','對帳單的分店是 '+(o.branchName||'')+'（'+o.branch+'），不是 '+pt.name+'，請確認貼對檔案。']);
    if(o.n){E.draft={days:Object.fromEntries(Object.entries(o.days).map(([d,x])=>[d,{tax:String(x.tax),free:String(x.free)}])),amount:o.amount,commission:o.commission,deduct:o.deduct,payable:o.payable,rate:o.rate};if(o.month)E.month=o.month;msg.push(['ok','讀到 '+o.n+' 天，合計 '+money(o.sum)+(o.amount!=null?'（對帳單總額 '+money(o.amount)+'）':'')])}
    o.warn.forEach(w=>msg.push(['warn',w]));E.msg=msg},
  async stsave2(){const E=S.ui.stEdit;const D=E.draft;const days={};let sum=0;for(const [d,x] of Object.entries(D.days||{})){const t=num(x.tax),f=num(x.free);if(t||f||String(x.tax??'')!==''||String(x.free??'')!==''){days[d]={tax:t,free:f};sum+=t+f}}
    const rec={id:E.pt+'-'+E.month,store:E.pt,month:E.month,days,amount:String(D.amount??'')!==''?num(D.amount):sum,commission:String(D.commission??'')!==''?num(D.commission):null,deduct:String(D.deduct??'')!==''?num(D.deduct):null,payable:String(D.payable??'')!==''?num(D.payable):null,rate:D.rate||null,ts:Date.now()};
    if(await Store.save('statements',rec)){toast('已存 '+sname(E.pt)+' '+Number(E.month.slice(5))+' 月對帳單');S.sheet=null;S.ui.stEdit=null}render()},
  async stsave(v){const [pt,month]=v.split('|');const amt=num(S.ui['st-'+pt+'-'+month]);await Store.save('statements',{id:pt+'-'+month,store:pt,month,amount:amt,ts:Date.now()});toast('已存 '+sname(pt)+' '+Number(month.slice(5))+' 月結帳金額');render()},
  async csv(v){const f=csvOf(v);let dl=null;try{dl=window.claude&&window.claude.use?await Promise.race([window.claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),3000))]):null}catch(e){}
    if(dl){try{await dl.save({filename:f.name,data:'﻿'+f.text});return}catch(e){}}S.ui.csv=f.text;S.sheet='csv';render()},
  copycsv(){const el=document.getElementById('csvbox');copyText(el?el.value:S.ui.csv)},
  cfggift(v){const g=S.ui.cfg.dealGifts;const i=g.indexOf(v);if(i>=0)g.splice(i,1);else g.push(v)},
  cfgbag(){S.ui.cfg.autoBag=!S.ui.cfg.autoBag},
  cfgclose(v){S.ui.cfg.closeMode=v},
  async cfgsave(){const c=clone(S.ui.cfg);const split=t=>String(t).split(/[、,，\s]+/).map(x=>x.trim()).filter(Boolean);
    for(const s of COUNTERS)if((c.staffText||{})[s.id]!=null)c.staff[s.id]=split(c.staffText[s.id]);for(const s of CONSIGNS)if((c.ptText||{})[s.id]!=null){c.pt=c.pt||{};c.pt[s.id]=split(c.ptText[s.id])}delete c.staffText;delete c.ptText;
    for(const k of ['discountCap','discountStep','extraGiftCap','durianGiftCap','tastingBase','tastingPer','lowStock'])c[k]=num(c[k]);if(c.cprice)for(const k in c.cprice){if(String(c.cprice[k]??'')==='')delete c.cprice[k];else c.cprice[k]=num(c.cprice[k])}if(!c.discountStep)c.discountStep=10;if(c.commissionPct!=null){c.commission=num(c.commissionPct)/100;delete c.commissionPct}delete c.bossPin;delete c.adminPin;if(c.adminText!=null){c.admins=split(c.adminText);delete c.adminText}if(!(c.admins||[]).length)c.admins=['行政'];
    c.codes=c.codes||{};for(const [k,v] of Object.entries(c.newCodes||{})){const code=String(v||'').trim();if(!code)continue;if(!/^\d{4,8}$/.test(code)){toast('登入碼要 4～8 位數字');return}c.codes[k]=await codeHash(k,code)}delete c.newCodes;
    if(S.costs){const np=String(c.newPin||''),np2=String(c.newPin2||'');if(np&&(np!==np2||np.length<4)){toast(np!==np2?'兩次新 PIN 不一樣':'PIN 至少 4 碼');return}
      const costs={};for(const [k,v] of Object.entries(c.costEdit||{})){const x=parseFloat(String(v).replace(/[^\d.]/g,''));if(x>0)costs[k]=x}
      const pin=np||S.bossPin;c.costEnc=await sealCosts(pin,costs);S.costs=costs;if(np){S.bossPin=np;toast('總經理 PIN 已更改')}}
    delete c.costEdit;delete c.newPin;delete c.newPin2;
    await Store.saveConfig(c);S.ui.cfg=null;render()},
  async demo(){await Store.loadDemo();S.boss.date='2026-11-19';render()},
  reset(){S.ui.resetAsk=true},async resetok(){await Store.resetLocal();S.ui.resetAsk=false;toast('已清空');render()}
};
async function onUpload(input){const files=[...(input.files||[])];if(!files.length)return;S.ui.uploading=true;render();
  try{const r=S.session;
    if(input.id==='wastefile'){const p=await Store.addPhoto(files[0],{store:r.store,date:today(),kind:'銷毀',by:r.name,note:''});if(p)S.mv.photo=p.id}
    else if(input.id==='phfile'){for(const f of files)await Store.addPhoto(f,{store:r.store,date:today(),kind:S.ph.kind,by:r.name,note:S.ph.note.trim()});S.ph.note='';toast('照片已上傳')}
    else if(input.id==='ptbefore'||input.id==='ptafter'){const k=input.id==='ptbefore'?'before':'after';for(const f of files){const p=await Store.addPhoto(f,{store:r.store,date:S.pt.date,kind:k==='before'?'盤點前':'盤點後',by:r.name,note:''});if(p)S.pt[k].push(p.id)}}
  }catch(e){toast('照片沒有上傳成功：'+(e.code||e.message||e))}
  S.ui.uploading=false;input.value='';render()}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.disabled)return;const f=A[el.dataset.act];if(!f)return;if(!['checkout','closeok','mvsave','ptsave','asave'].includes(el.dataset.act)){S.ui.confirm=null;if(S.ui.guard&&(S.ui.guard.confirm||!(S.ui.miss||[]).length))S.ui.guard=null}
  const r=f(el.dataset.v,el,e);if(r&&r.then){await r;return}render()});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.bind){let v=el.value;if(el.inputMode==='numeric'&&el.type!=='password')v=v.replace(/[^\d]/g,'');setPath(el.dataset.bind,v);unmiss(el.id);if(el.id.startsWith('pay-'))unmiss('paybox');S.ui.confirm=null;if(S.ui.guard&&S.ui.guard.confirm)S.ui.guard=null;render();return}
  const a=el.dataset.actIn;if(!a||a==='upload')return;
  if(a==='qtyset'){const i=+el.dataset.i;const q=num(el.value);if(q>0){S.cart[i].qty=q;render()}}
  else if(a==='sheetdate'){S.sheetDate=el.value||today();render()}
  else if(a==='adate'){S.adm.date=el.value||today();render()}
  else if(a==='ptdate'){S.pt.date=el.value||today();render()}
  else if(a==='bdate'){S.boss.date=el.value||null;render()}
  else if(a==='ptexpin'){const E=S.ui.ex;if(E&&el.value){S.pt.lines[E.id].lots[E.j].exp=el.value;S.sheet=null;S.ui.ex=null}render()}
  else if(a==='bmonth'){if(el.value)S.boss.month=el.value;render()}});
document.addEventListener('change',e=>{if(e.target.dataset.actIn==='upload')onUpload(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}if(e.key==='Enter'&&e.target.id==='pin'){A.pinok();render()}});
Store.boot().then(()=>{const s=S.session;if(s&&(s.role==='staff'||s.role==='pt')&&!STORES.some(x=>x.id===s.store))S.session=null;render()});
render();
}
